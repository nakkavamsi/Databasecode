name: Build Database Project

on:
  push:
    branches:
      - main
      - nvkdbchanges
  pull_request:
    branches:
      - main
      - nvkdbchanges

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync schema from migrations
        run: python3 scripts/sync-schema-from-migrations.py

      - name: Build SQL project
        run: dotnet build Databasecode.sqlproj --configuration Release

      - name: Upload dacpac artifact
        uses: actions/upload-artifact@v4
        with:
          name: Databasecode-dacpac
          path: bin/Release/*.dacpac
          if-no-files-found: error
